name: app_scan
description: QR Code Scanner and Generator App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # QR scanning
  mobile_scanner: ^3.5.6

  # QR generation
  qr_flutter: ^4.1.0

  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.7.3

  # CSV/Excel export
  csv: ^6.0.0
  excel: ^4.0.3

  # File saving & sharing
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  permission_handler: ^11.3.0

  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # for biometric login
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/app_logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/